  }

  cache(){
    const q = s => this.querySelector(s);
    this.toolbar = q('.toolbar');
    this.layersList = q('.layers-list');
    this.lottieMount = q('.lottie-mount');
    this.previewContainer = q('.preview-container');
    this.timelineBody = q('.timeline-body');
    this.rulerWrap = q('.ruler-wrap');
    this.ruler = q('.ruler');
    this.rowsWrap = q('.rows-wrap');
    this.rowsInner = q('.rows-inner');
    this.curEl = q('.toolbar .cur');
    this.totEl = q('.toolbar .tot');
    this.zoomLabel = q('.zoom-label');
    this.jsonPanel = q('.json-panel');
    this.jsonTextarea = q('.json-panel textarea');
    this.jsonError = q('.json-error');
    this.fileInput = q('.file-input');
    this.propsContainer = q('.props-container');
    this.playheadMarker = null;
    this.playheadLine = null;
  }

  attachEvents(){
    this.toolbar.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const a = btn.dataset.action;
      if (a === 'add-toggle'){
        this.toggleDropdown(this.toolbar.querySelector('[data-dropdown="add"]'));
        e.stopPropagation();
        return;
      }
      this.closeAllDropdowns();
      if (a === 'add-rect') this.addShapeLayer('rc');
      else if (a === 'add-ellipse') this.addShapeLayer('el');
      else if (a === 'add-text') this.addTextLayer();
      else if (a === 'play') this.togglePlay();
      else if (a === 'stop') this.stop();
      else if (a === 'undo') this.undo();
      else if (a === 'redo') this.redo();
      else if (a === 'import') this.fileInput.click();
      else if (a === 'export') this.exportJson();
      else if (a === 'toggle-view') this.toggleView();
    });
    document.addEventListener('click', e => {
      const dd = this.toolbar.querySelector('[data-dropdown="add"]');
      if (dd && !dd.contains(e.target)) dd.classList.remove('open');
    });
    this.fileInput.addEventListener('change', e => this.handleImport(e));
    this.querySelector('.timeline-toolbar').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      const a = b.dataset.action;
      if (a === 'zoom-in') this.setZoom(this.zoom * 1.25);
      else if (a === 'zoom-out') this.setZoom(this.zoom / 1.25);
      else if (a === 'zoom-fit') this.setZoom(1);
    });
    this.timelineBody.addEventListener('wheel', e => {
      if (e.ctrlKey || e.metaKey){
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
        this.setZoom(this.zoom * factor, e.clientX);
        return;
      }
      if (e.shiftKey){
        e.preventDefault();
        this.rowsWrap.scrollLeft += e.deltaY;
        return;
      }
    }, { passive: false });
    this.rulerWrap.addEventListener('wheel', e => {
      if (e.ctrlKey || e.metaKey) return;
      e.preventDefault();
      const dx = e.shiftKey ? e.deltaY : (e.deltaX || e.deltaY);
      this.rowsWrap.scrollLeft += dx;
    }, { passive: false });
    this.rulerWrap.addEventListener('pointerdown', e => {
      if (e.target.closest('.playhead-marker')) return;
      try { this.rulerWrap.setPointerCapture(e.pointerId); } catch(_){}
      this.seekFromClientX(e.clientX);
      const move = ev => this.seekFromClientX(ev.clientX);
      const up = ev => {
        this.rulerWrap.removeEventListener('pointermove', move);
        this.rulerWrap.removeEventListener('pointerup', up);
        try { this.rulerWrap.releasePointerCapture(ev.pointerId); } catch(_){}
      };
      this.rulerWrap.addEventListener('pointermove', move);
      this.rulerWrap.addEventListener('pointerup', up);
    });
    this.rowsWrap.addEventListener('scroll', () => {
      if (this._syncingScroll) return;
      this._syncingScroll = true;
      this.layersList.scrollTop = this.rowsWrap.scrollTop;
      if (this.ruler) this.ruler.style.transform = `translateX(${-this.rowsWrap.scrollLeft}px)`;
      requestAnimationFrame(() => { this._syncingScroll = false; });
    });
    this.layersList.addEventListener('scroll', () => {
      if (this._syncingScroll) return;
      this._syncingScroll = true;
      this.rowsWrap.scrollTop = this.layersList.scrollTop;
      requestAnimationFrame(() => { this._syncingScroll = false; });
    });
    let deb;
    this.jsonTextarea.addEventListener('input', () => {
      clearTimeout(deb);
      deb = setTimeout(()=>this.applyJsonFromEditor(), 500);
    });
    let rdeb;
    window.addEventListener('resize', () => {
      clearTimeout(rdeb);
      rdeb = setTimeout(()=>this.renderTimeline(), 120);
    });
    this.propsContainer.addEventListener('input', e => this.onPropInput(e));
    this.propsContainer.addEventListener('click', e => this.onPropClick(e));
    this.propsContainer.addEventListener('pointerdown', e => {
      const h = e.target.closest('.bezier-handle');
      if (h) this.startEasingDrag(h, e);
    });
    document.addEventListener('keydown', e => this.onKeyDown(e));
  }

  // ========== Вспомогательное ==========
  getLayerSt(layer){ return (layer && layer.st) || 0; }

  // ========== История ==========
  initHistory(){
    this.history = [{ data: JSON.stringify(this.lottieData), sel: this.selectedLayerIndex, frame: this.currentFrame, label: 'Initial' }];
    this.historyIndex = 0;
    this.updateHistoryButtons();
  }
  beginTransaction(label = ''){
    if (this._inTransaction) return;
    this._inTransaction = true;
    this._transactionLabel = label;
  }
  endTransaction(){
    if (!this._inTransaction) return;
    this._inTransaction = false;
    const current = JSON.stringify(this.lottieData);
    const last = this.history[this.historyIndex];
    if (last && last.data === current) return;
    this.history = this.history.slice(0, this.historyIndex + 1);
    this.history.push({ data: current, sel: this.selectedLayerIndex, frame: this.currentFrame, label: this._transactionLabel });
    if (this.history.length > 100) this.history.shift();
    this.historyIndex = this.history.length - 1;
    this.updateHistoryButtons();
  }
  commit(label){
    if (this._commitTimer){ clearTimeout(this._commitTimer); this._commitTimer = null; }
    this.beginTransaction(label);
    this.endTransaction();
  }
  scheduleCommit(label){
    this._commitLabel = label;
    if (this._commitTimer) clearTimeout(this._commitTimer);
    this._commitTimer = setTimeout(() => {
      this._commitTimer = null;
      this.commit(this._commitLabel || 'Edit');
    }, 500);
  }
  undo(){ if (this.historyIndex <= 0) return; this.historyIndex--; this.applyHistorySnapshot(); }
  redo(){ if (this.historyIndex >= this.history.length - 1) return; this.historyIndex++; this.applyHistorySnapshot(); }
  applyHistorySnapshot(){
    const snap = this.history[this.historyIndex];
    if (!snap) return;
    this.lottieData = JSON.parse(snap.data);
    this.selectedLayerIndex = snap.sel;
    this.currentFrame = snap.frame;
    this.activeEasing = null;
    this.updatePreview(); this.renderLayers(); this.renderTimeline(); this.renderProps();
    this.updatePlayhead(); this.updateFrameDisplay(); this.refreshJsonIfVisible(); this.updateHistoryButtons();
  }
  updateHistoryButtons(){
    const u = this.toolbar.querySelector('[data-action="undo"]');
    const r = this.toolbar.querySelector('[data-action="redo"]');
    if (u) u.disabled = this.historyIndex <= 0;
    if (r) r.disabled = this.historyIndex >= this.history.length - 1;
  }

  onKeyDown(e){
    const tag = document.activeElement?.tagName;
    const inField = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || document.activeElement?.isContentEditable;
    if (e.ctrlKey || e.metaKey){
      const k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey){ e.preventDefault(); this.undo(); return; }
      if ((k === 'z' && e.shiftKey) || k === 'y'){ e.preventDefault(); this.redo(); return; }
      if (k === 'd'){ e.preventDefault(); this.duplicateSelectedLayer(); return; }
      if (k === 'i'){ e.preventDefault(); this.fileInput.click(); return; }
      if (k === 'e'){ e.preventDefault(); this.exportJson(); return; }
      return;
    }
    if (inField) return;
    if (e.code === 'Space'){ e.preventDefault(); this.togglePlay(); return; }
    if (e.key === 'ArrowLeft'){ e.preventDefault(); this.seekRelative(e.shiftKey ? -10 : -1); return; }
    if (e.key === 'ArrowRight'){ e.preventDefault(); this.seekRelative(e.shiftKey ? 10 : 1); return; }
    if (e.key === 'Home'){ e.preventDefault(); this.seekTo(0); return; }
    if (e.key === 'End'){ e.preventDefault(); this.seekTo(this.lottieData.op); return; }
    if (e.key === 'Delete' || e.key === 'Backspace'){
      if (this.selectedLayerIndex >= 0){ e.preventDefault(); this.deleteSelectedLayer(); }
      return;
    }
  }

  seekTo(frame){
    this.currentFrame = clamp(frame, 0, this.lottieData.op);
    if (this.animInstance) try { this.animInstance.goToAndStop(this.currentFrame, true); } catch(_){}
    this.updatePlayhead(); this.updateFrameDisplay(); this.renderProps();
  }
  seekRelative(delta){ this.seekTo(this.currentFrame + delta); }

  deleteSelectedLayer(){
    if (this.selectedLayerIndex < 0) return;
    const layer = this.lottieData.layers[this.selectedLayerIndex];
    if (layer?.locked){ alert('Слой заблокирован.'); return; }
    if (!confirm('Удалить слой?')) return;
    this.beginTransaction('Delete layer');
    this.lottieData.layers.splice(this.selectedLayerIndex, 1);
    this.selectedLayerIndex = -1;
    this.activeEasing = null;
    this.endTransaction();
    this.updatePreview(); this.renderLayers(); this.renderTimeline();
    this.renderProps(); this.refreshJsonIfVisible();
  }
  duplicateSelectedLayer(){
    if (this.selectedLayerIndex < 0) return;
    const src = this.lottieData.layers[this.selectedLayerIndex];
    if (src?.locked){ alert('Слой заблокирован.'); return; }
    const copy = deepClone(src);
    copy.ind = nextLayerInd(this.lottieData);
    copy.nm = (copy.nm || 'Layer') + ' copy';
    delete copy.locked;
    this.beginTransaction('Duplicate layer');
    this.lottieData.layers.splice(this.selectedLayerIndex, 0, copy);
    this.endTransaction();
    this.updatePreview(); this.renderLayers(); this.renderTimeline();
    this.renderProps(); this.refreshJsonIfVisible();
  }

  toggleLayerHidden(idx){
    const layer = this.lottieData.layers[idx];
    if (!layer) return;
    this.beginTransaction('Toggle visibility');
    layer.hd = !layer.hd;
    this.endTransaction();
    this.updatePreview(); this.renderLayers(); this.renderTimeline();
    this.renderProps(); this.refreshJsonIfVisible();
  }
  toggleLayerLocked(idx){
    const layer = this.lottieData.layers[idx];
    if (!layer) return;
    this.beginTransaction('Toggle lock');
    layer.locked = !layer.locked;
    this.endTransaction();
    this.renderLayers(); this.renderTimeline(); this.renderProps();
  }

  // ========== Shape helpers ==========
  findFirstShape(layer){
    if (!layer.shapes) return null;
    const walk = (nodes) => {
      if (!Array.isArray(nodes)) return null;
      for (const n of nodes){
        if (!n || typeof n !== 'object') continue;
        if (n.ty === 'rc' || n.ty === 'el' || n.ty === 'sr' || n.ty === 'sh') return n;
        if (Array.isArray(n.it)){ const r = walk(n.it); if (r) return r; }
      }
      return null;
    };
    return walk(layer.shapes);
  }
  getShapeSize(shape){
    if (!shape || !shape.s) return [0, 0];
    let k = shape.s.k;
    if (shape.s.a === 1 && Array.isArray(k)) k = k[0]?.s ?? [0, 0];
    if (Array.isArray(k)) return [k[0] ?? 0, k[1] ?? 0];
    return [k, k];
  }
  setShapeSize(shape, w, h){
    if (!shape || !shape.s) return;
    if (shape.s.a === 1 && Array.isArray(shape.s.k)){
      if (shape.s.k[0]?.s) shape.s.k[0].s = [w, h];
      else if (shape.s.k[0]) shape.s.k[0] = { t: shape.s.k[0].t, s: [w, h] };
    } else {
      shape.s.k = [w, h];
    }
  }
  getRectRadius(shape){
    if (!shape || shape.ty !== 'rc' || !shape.r) return 0;
    let k = shape.r.k;
    if (shape.r.a === 1 && Array.isArray(k)) k = k[0]?.s ?? 0;
    return typeof k === 'number' ? k : 0;
  }
  setRectRadius(shape, r){
    if (!shape || shape.ty !== 'rc') return;
    if (!shape.r) shape.r = { a:0, k: r };
    if (shape.r.a === 1 && Array.isArray(shape.r.k)){
      if (shape.r.k[0]) shape.r.k[0].s = r;
    } else {
      shape.r.k = r;
    }
  }

  // ========== Dropdown / zoom ==========
  toggleDropdown(dd){
    const wasOpen = dd.classList.contains('open');
    this.closeAllDropdowns();
    if (!wasOpen){
      dd.classList.add('open');
      const btn = dd.querySelector('button');
      const menu = dd.querySelector('.dropdown-menu');
      const r = btn.getBoundingClientRect();
      menu.style.top = (r.bottom + 4) + 'px';
      menu.style.left = r.left + 'px';
    }
  }
  closeAllDropdowns(){ this.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open')); }

  setZoom(z, anchorClientX){
    const old = this.zoom;
    this.zoom = clamp(z, 0.25, 8);
    if (this.zoom === old) return;
    let anchorFrame = this.currentFrame;
    if (typeof anchorClientX === 'number'){
      const rect = this.timelineBody.getBoundingClientRect();
      anchorFrame = (anchorClientX - rect.left + this.rowsWrap.scrollLeft) / this.pxPerFrame;
    }
    this.renderTimeline();
    if (typeof anchorClientX === 'number'){
      const rect = this.timelineBody.getBoundingClientRect();
      this.rowsWrap.scrollLeft = Math.max(0, anchorFrame * this.pxPerFrame - (anchorClientX - rect.left));
      if (this.ruler) this.ruler.style.transform = `translateX(${-this.rowsWrap.scrollLeft}px)`;
    }
    this.zoomLabel.textContent = Math.round(this.zoom * 100) + '%';
  }

  renderAll(){
    this.totEl.textContent = this.lottieData.op;
    this.zoomLabel.textContent = Math.round(this.zoom * 100) + '%';
    this.updatePreview(); this.renderLayers(); this.renderTimeline(); this.renderProps();
    this.updatePlayhead(); this.updateFrameDisplay(); this.refreshJsonIfVisible(); this.updateHistoryButtons();
  }

  updatePreview(){
    if (this.animInstance){ try { this.animInstance.destroy(); } catch(_){} this.animInstance = null; }
    this.lottieMount.innerHTML = '';
    const w = this.lottieData.w || 500;
    const h = this.lottieData.h || 500;
    this.previewContainer.style.width = w + 'px';
    this.previewContainer.style.height = h + 'px';
    const inst = lottie.loadAnimation({
      container: this.lottieMount, renderer: 'svg', loop: false, autoplay: false,
      animationData: deepClone(this.lottieData)
    });
    this.animInstance = inst;
    const applyFrame = () => {
      if (!this.animInstance) return;
      try { this.animInstance.goToAndStop(this.currentFrame, true); } catch(_){}
      const svg = this.lottieMount.querySelector('svg');
      if (svg){ svg.style.width='100%'; svg.style.height='100%'; svg.style.display='block'; }
    };
    inst.addEventListener('DOMLoaded', applyFrame);
    setTimeout(applyFrame, 0);
    setTimeout(applyFrame, 80);
  }

  // ========== Layers panel ==========
  renderLayers(){
    this.layersList.innerHTML = '';
    this.lottieData.layers.forEach((layer, i) => {
      const isHidden = !!layer.hd;
      const isLocked = !!layer.locked;
      const item = document.createElement('div');
      item.className = 'layer-item'
        + (i === this.selectedLayerIndex ? ' selected' : '')
        + (isHidden ? ' hidden' : '')
        + (isLocked ? ' locked' : '');
      item.draggable = true;
      item.dataset.index = i;
      let icon = '◦';
      if (layer.ty === 4) icon = '⬛';
      else if (layer.ty === 5) icon = 'T';
      else if (layer.ty === 2) icon = '🖼';
      else if (layer.ty === 1) icon = '▭';
      item.innerHTML = `
        <span class="drag-grip" title="Перетащи для изменения порядка">⋮⋮</span>
        <span class="icon">${icon}</span>
        <span class="name" title="#${i}">${escapeHtml(layer.nm || 'Layer ' + i)}</span>
        <button class="toggle-btn hide-toggle" title="${isHidden ? 'Показать' : 'Скрыть'}" draggable="false">${isHidden ? '◌' : '◉'}</button>
        <button class="toggle-btn lock-toggle" title="${isLocked ? 'Разблокировать' : 'Заблокировать'}" draggable="false">${isLocked ? '🔒' : '🔓'}</button>
      `;
      const hideBtn = item.querySelector('.hide-toggle');
      const lockBtn = item.querySelector('.lock-toggle');
      hideBtn.addEventListener('pointerdown', ev => ev.stopPropagation());
      lockBtn.addEventListener('pointerdown', ev => ev.stopPropagation());
      hideBtn.addEventListener('click', ev => { ev.stopPropagation(); this.toggleLayerHidden(i); });
      lockBtn.addEventListener('click', ev => { ev.stopPropagation(); this.toggleLayerLocked(i); });
      item.addEventListener('click', () => {
        if (item.classList.contains('was-dragged')) return;
        this.selectedLayerIndex = i;
        if (this.activeEasing) this.activeEasing = null;
        this.renderLayers(); this.renderTimeline(); this.renderProps();
      });
      this.attachRowDnD(item, i, this.layersList, () => {
        this.updatePreview(); this.renderLayers(); this.renderTimeline(); this.renderProps(); this.refreshJsonIfVisible();
      });
      this.layersList.appendChild(item);
    });
  }

  attachRowDnD(el, idx, container, onDrop){
    el.addEventListener('dragstart', e => {
      this._dragSrcIndex = idx;
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(idx)); } catch(_){}
      el.classList.add('dragging');
      this.beginTransaction('Reorder layers');
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      el.classList.remove('was-dragged');
      container.querySelectorAll('.drop-above, .drop-below').forEach(x => {
        x.classList.remove('drop-above', 'drop-below');
      });
      this._dragSrcIndex = -1;
      this.endTransaction();
    });
    el.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (this._dragSrcIndex === idx){ el.classList.remove('drop-above', 'drop-below'); return; }
      const rect = el.getBoundingClientRect();
      const below = e.clientY > rect.top + rect.height / 2;
      container.querySelectorAll('.drop-above, .drop-below').forEach(x => { if (x !== el) x.classList.remove('drop-above', 'drop-below'); });
      el.classList.toggle('drop-above', !below);
      el.classList.toggle('drop-below', below);
    });
    el.addEventListener('dragleave', () => { el.classList.remove('drop-above', 'drop-below'); });
    el.addEventListener('drop', e => {
      e.preventDefault();
      const srcIdx = this._dragSrcIndex;
      if (srcIdx < 0 || srcIdx === idx) return;
      const rect = el.getBoundingClientRect();
      const below = e.clientY > rect.top + rect.height / 2;
      const layers = this.lottieData.layers;
      const selectedLayer = this.selectedLayerIndex >= 0 ? layers[this.selectedLayerIndex] : null;
      const [moved] = layers.splice(srcIdx, 1);
      let targetIdx = idx;
      if (srcIdx < idx) targetIdx = idx - 1;
      if (below) targetIdx += 1;
      targetIdx = clamp(targetIdx, 0, layers.length);
      layers.splice(targetIdx, 0, moved);
      if (selectedLayer){ const newIdx = layers.indexOf(selectedLayer); if (newIdx >= 0) this.selectedLayerIndex = newIdx; }
      el.classList.add('was-dragged');
      setTimeout(() => el.classList.remove('was-dragged'), 0);
      onDrop();
    });
  }

  // ========== Timeline ==========
  renderTimeline(){
    const totalFrames = this.lottieData.op || 1;
    const fps = this.lottieData.fr || 30;
    const bodyWidth = this.timelineBody.clientWidth || 800;
    this.basePxPerFrame = bodyWidth / totalFrames;
    this.pxPerFrame = Math.max(0.5, this.basePxPerFrame * this.zoom);
    const totalWidth = totalFrames * this.pxPerFrame;
    this.rowsInner.style.setProperty('--grid-minor', this.pxPerFrame + 'px');
    this.rowsInner.style.setProperty('--grid-major', (this.pxPerFrame * fps) + 'px');
    this.ruler.style.setProperty('--grid-minor', (this.pxPerFrame * fps) + 'px');
    this.ruler.style.width = totalWidth + 'px';
    this.rowsInner.style.width = totalWidth + 'px';
    this.ruler.innerHTML = '';
    const minorInterval = Math.max(1, Math.round(fps / 2));
    for (let f = 0; f <= totalFrames; f += minorInterval){
      const isMajor = f % fps === 0;
      if (!isMajor && this.pxPerFrame * minorInterval < 12) continue;
      const tick = document.createElement('div');
      tick.className = 'ruler-tick' + (isMajor ? ' major' : '');
      tick.style.left = (f * this.pxPerFrame) + 'px';
      if (isMajor) tick.textContent = (f / fps) + 's';
      this.ruler.appendChild(tick);
    }
    this.playheadMarker = document.createElement('div');
    this.playheadMarker.className = 'playhead-marker';
    this.playheadMarker.innerHTML = `<div class="head"></div><div class="stem"></div>`;
    this.ruler.appendChild(this.playheadMarker);
    this.attachPlayheadDrag(this.playheadMarker);
    this.rowsInner.innerHTML = '';
    this.playheadLine = document.createElement('div');
    this.playheadLine.className = 'playhead-line';
    this.rowsInner.appendChild(this.playheadLine);

    this.lottieData.layers.forEach((layer, i) => {
      const row = document.createElement('div');
      row.className = 'timeline-row';
      row.draggable = true;
      row.dataset.index = i;
      this.attachRowDnD(row, i, this.rowsInner, () => {
        this.updatePreview(); this.renderLayers(); this.renderTimeline(); this.renderProps(); this.refreshJsonIfVisible();
      });
      const isHidden = !!layer.hd;
      const isLocked = !!layer.locked;
      const bar = document.createElement('div');
      bar.className = 'time-bar'
        + (i === this.selectedLayerIndex ? ' selected' : '')
        + (isHidden ? ' hidden-layer' : '')
        + (isLocked ? ' locked' : '');
      bar.draggable = false;
      const ip = layer.ip || 0;
      const op = layer.op || 0;
      const st = this.getLayerSt(layer);
      bar.style.left = (ip * this.pxPerFrame) + 'px';
      bar.style.width = Math.max((op - ip) * this.pxPerFrame, 12) + 'px';
      const hL = document.createElement('div');
      hL.className = 'handle handle-left';
      const label = document.createElement('span');
      label.className = 'bar-label';
      label.textContent = `${ip}–${op}`;
      const hR = document.createElement('div');
      hR.className = 'handle handle-right';
      bar.appendChild(hL); bar.appendChild(label); bar.appendChild(hR);

      const kfFrames = this.collectKeyframeFrames(layer);
      kfFrames.forEach(f => {
        const absFrame = st + f;
        if (absFrame < ip || absFrame > op) return;
        const marker = document.createElement('div');
        marker.className = 'kf-marker'
          + ((this.activeEasing?.frame === f && this.selectedLayerIndex === i) ? ' active' : '');
        marker.style.left = ((absFrame - ip) * this.pxPerFrame) + 'px';
        const paths = this.collectKeyframePaths(layer, f);
        marker.dataset.frame = f;
        marker.dataset.absFrame = absFrame;
        marker.dataset.kfPaths = JSON.stringify(paths);
        marker.title = paths.length
          ? `Keyframe @ ${absFrame} (внутр. ${f}): ${paths.join(', ')}\nКлик — открыть Easing`
          : `Keyframe @ ${absFrame}`;
        marker.addEventListener('pointerdown', ev => ev.stopPropagation());
        marker.addEventListener('click', ev => {
          ev.stopPropagation();
          this.openKeyframeFromMarker(marker);
        });
        bar.appendChild(marker);
      });

      this.attachBarDrag(bar, row, i);
      row.appendChild(bar);
      this.rowsInner.appendChild(row);
    });
    if (this.ruler) this.ruler.style.transform = `translateX(${-this.rowsWrap.scrollLeft}px)`;
    this.updatePlayhead();
  }

  collectKeyframeFrames(layer){
    const frames = new Set();
    const walk = (obj) => {
      if (!obj || typeof obj !== 'object') return;
      if (obj.a === 1 && Array.isArray(obj.k)){
        obj.k.forEach(kf => { if (typeof kf.t === 'number') frames.add(kf.t); });
        return;
      }
      for (const k in obj){
        if (k === 'k' || k === 'a') continue;
        walk(obj[k]);
      }
    };
    walk(layer.ks);
    return [...frames].sort((a,b)=>a-b);
  }
  collectKeyframePaths(layer, frame, prefix = 'ks'){
    const out = [];
    const walk = (obj, path) => {
      if (!obj || typeof obj !== 'object') return;
      if (obj.a === 1 && Array.isArray(obj.k)){
        if (obj.k.some(kf => kf.t === frame)) out.push(path);
        return;
      }
      if (obj.ix !== undefined || obj.k !== undefined) return;
      for (const key in obj){
        if (key.startsWith('it') || key === 'shapes') continue;
        const v = obj[key];
        if (v && typeof v === 'object' && !Array.isArray(v)) walk(v, `${path}.${key}`);
      }
    };
    walk(layer.ks, prefix);
    return out;
  }

  openKeyframeFromMarker(marker){
    const internalFrame = parseFloat(marker.dataset.frame);
    const absFrame = parseFloat(marker.dataset.absFrame);
    if (isNaN(internalFrame)) return;
    const useAbs = isNaN(absFrame) ? internalFrame : absFrame;
    let paths = [];
    try { paths = JSON.parse(marker.dataset.kfPaths || '[]'); } catch(_){}
    const row = marker.closest('.timeline-row');
    const layerIndex = row ? parseInt(row.dataset.index, 10) : this.selectedLayerIndex;
    if (isNaN(layerIndex)) return;

    this.selectedLayerIndex = layerIndex;
    this.currentFrame = useAbs;
    if (this.animInstance) try { this.animInstance.goToAndStop(useAbs, true); } catch(_){}

    const layer = this.lottieData.layers[layerIndex];
    let chosen = null;
    if (layer){
      if (this.activeEasing && this.activeEasing.frame === internalFrame
          && getPath(layer, this.activeEasing.path)?.a === 1
          && getPath(layer, this.activeEasing.path).k.some(k => k.t === internalFrame)){
        chosen = this.activeEasing.path;
      } else {
        chosen = paths[0] || null;
      }
    }
    this.activeEasing = chosen ? { path: chosen, frame: internalFrame } : null;

    this.updatePlayhead(); this.updateFrameDisplay();
    this.renderLayers(); this.renderTimeline(); this.renderProps();
    const activeChip = this.propsContainer.querySelector('.kf-chip.active');
    if (activeChip) activeChip.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  attachBarDrag(bar, row, layerIndex){
    bar.addEventListener('pointerdown', e => {
      const layer = this.lottieData.layers[layerIndex];
      if (layer?.locked){
        e.preventDefault(); e.stopPropagation();
        this.selectedLayerIndex = layerIndex;
        if (this.activeEasing) this.activeEasing = null;
        this.renderLayers(); this.renderTimeline(); this.renderProps();
        return;
      }
      e.preventDefault(); e.stopPropagation();
      row.draggable = false;
      try { bar.setPointerCapture(e.pointerId); } catch(_){}
      const mode = e.target.classList.contains('handle-left') ? 'left'
                 : e.target.classList.contains('handle-right') ? 'right'
                 : 'move';
      const startX = e.clientX;
      const startIp = layer.ip || 0;
      const startOp = layer.op || 0;
      const startLeft = startIp * this.pxPerFrame;
      const startWidth = Math.max((startOp - startIp) * this.pxPerFrame, 12);
      let moved = false;
      this.beginTransaction(
        mode === 'move' ? 'Shift layer' : (mode === 'left' ? 'Change ip' : 'Change op')
      );
      const onMove = ev => {
        const dx = ev.clientX - startX;
        if (Math.abs(dx) > 2) moved = true;
        if (mode === 'move'){
          // ИСПРАВЛЕНО: без Math.max(0, ...) — бар может уезжать влево за 0
          bar.style.left = (startLeft + dx) + 'px';
        } else if (mode === 'left'){
          const newLeft = Math.min(startLeft + startWidth - 12, Math.max(0, startLeft + dx));
          bar.style.left = newLeft + 'px';
          bar.style.width = (startLeft + startWidth - newLeft) + 'px';
        } else if (mode === 'right'){
          bar.style.width = Math.max(12, startWidth + dx) + 'px';
        }
      };
      const onUp = ev => {
        bar.removeEventListener('pointermove', onMove);
        bar.removeEventListener('pointerup', onUp);
        try { bar.releasePointerCapture(ev.pointerId); } catch(_){}
        row.draggable = true;
        if (!moved){
          this.selectedLayerIndex = layerIndex;
          if (this.activeEasing) this.activeEasing = null;
          this.endTransaction();
          this.renderLayers(); this.renderTimeline(); this.renderProps();
          return;
        }
        const dx = ev.clientX - startX;
        const deltaFrames = Math.round(dx / this.pxPerFrame);
        if (mode === 'move'){
          if (deltaFrames !== 0) this.shiftLayerTime(layerIndex, deltaFrames);
          else this.renderTimeline();
        } else if (mode === 'left'){
          const newIp = clamp(startIp + deltaFrames, 0, startOp - 1);
          layer.ip = newIp;
          this.updatePreview(); this.renderTimeline(); this.renderProps(); this.refreshJsonIfVisible();
        } else if (mode === 'right'){
          const newOp = Math.max(startIp + 1, startOp + deltaFrames);
          layer.op = newOp;
          this.updatePreview(); this.renderTimeline(); this.renderProps(); this.refreshJsonIfVisible();
        }
        this.endTransaction();
      };
      bar.addEventListener('pointermove', onMove);
      bar.addEventListener('pointerup', onUp);
    });
  }

  attachPlayheadDrag(el){
    const startDrag = (e) => {
      e.preventDefault(); e.stopPropagation();
      try { el.setPointerCapture(e.pointerId); } catch(_){}
      const move = ev => this.seekFromClientX(ev.clientX);
      const up = ev => {
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        try { el.releasePointerCapture(ev.pointerId); } catch(_){}
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
      this.seekFromClientX(e.clientX);
    };
    el.addEventListener('pointerdown', startDrag);
  }

  seekFromClientX(clientX){
    const rect = this.timelineBody.getBoundingClientRect();
    const x = clientX - rect.left + this.rowsWrap.scrollLeft;
    const f = clamp(x / this.pxPerFrame, 0, this.lottieData.op);
    this.currentFrame = f;
    if (this.animInstance){ try { this.animInstance.goToAndStop(f, true); } catch(_){} }
    this.updatePlayhead(); this.updateFrameDisplay(); this.renderProps();
  }

  shiftLayerTime(index, delta){
    const l = this.lottieData.layers[index];
    if (!l) return;
    // 1. Смещаем окно видимости
    l.ip = (l.ip || 0) + delta;
    l.op = (l.op || 0) + delta;
    // 2. Смещаем все keyframes внутри слоя (transform, shapes, текст)
    this.shiftLayerKeyframes(l, delta);
    if (l.op <= l.ip) l.op = l.ip + 1;
    this.updatePreview(); this.renderTimeline(); this.renderProps(); this.refreshJsonIfVisible();
  }

  shiftLayerKeyframes(layer, delta){
    const walk = (obj) => {
      if (!obj || typeof obj !== 'object') return;
      if (Array.isArray(obj)){
        for (let i = 0; i < obj.length; i++) walk(obj[i]);
        return;
      }
      // Анимированное свойство Lottie: {a:1, k:[{t,s,i,o}, ...]}
      if (obj.a === 1 && Array.isArray(obj.k)){
        for (let i = 0; i < obj.k.length; i++){
          const kf = obj.k[i];
          if (kf && typeof kf.t === 'number') kf.t += delta;
        }
        return;
      }
      for (const key in obj){
        if (!Object.prototype.hasOwnProperty.call(obj, key)) continue;
        const v = obj[key];
        if (v && typeof v === 'object') walk(v);
      }
    };
    if (layer.ks) walk(layer.ks);
    if (layer.shapes) walk(layer.shapes);
    if (layer.t) walk(layer.t);
  }

  updatePlayhead(){
    const x = this.currentFrame * this.pxPerFrame;
    if (this.playheadMarker) this.playheadMarker.style.left = x + 'px';
    if (this.playheadLine) this.playheadLine.style.left = x + 'px';
  }
  updateFrameDisplay(){ this.curEl.textContent = Math.round(this.currentFrame); }

  // ========== Playback ==========
  togglePlay(){ this.isPlaying ? this.pause() : this.play(); }
  play(){
    if (this.isPlaying) return;
    this.isPlaying = true;
    this.lastTick = performance.now();
    const b = this.toolbar.querySelector('[data-action="play"]');
    if (b) b.textContent = '⏸ Pause';
    this.tick();
  }
  pause(){
    this.isPlaying = false;
    const b = this.toolbar.querySelector('[data-action="play"]');
    if (b) b.textContent = '▶ Play';
    if (this.rafId) cancelAnimationFrame(this.rafId);
    this.rafId = null;
  }
  stop(){
    this.pause();
    this.currentFrame = 0;
    if (this.animInstance){ try { this.animInstance.goToAndStop(0, true); } catch(_){} }
    this.updatePlayhead(); this.updateFrameDisplay(); this.renderProps();
  }
  tick(){
    if (!this.isPlaying) return;
    const now = performance.now();
    const dt = (now - this.lastTick) / 1000;
    this.lastTick = now;
    this.currentFrame += dt * (this.lottieData.fr || 30);
    if (this.currentFrame >= this.lottieData.op) this.currentFrame = 0;
    if (this.animInstance){ try { this.animInstance.goToAndStop(this.currentFrame, true); } catch(_){} }
    this.updatePlayhead(); this.updateFrameDisplay();
    this.rafId = requestAnimationFrame(()=>this.tick());
  }

  // ========== Props ==========
  renderProps(){
    const i = this.selectedLayerIndex;
    if (i < 0 || !this.lottieData.layers[i]){
      this.propsContainer.innerHTML = '<span class="empty-note">Выберите слой.</span>';
      return;
    }
    const layer = this.lottieData.layers[i];
    const absFrame = Math.round(this.currentFrame);
    const st = this.getLayerSt(layer);
    const f = absFrame - st;

    if (layer.locked){
      this.propsContainer.innerHTML = `
        <h3>Слой ${i}</h3>
        <div class="locked-note">
          🔒 Слой заблокирован.<br>
          Редактирование недоступно.
          <button class="danger-btn secondary" data-action="unlock-layer">🔓 Разблокировать</button>
        </div>`;
      return;
    }

    const getK = (path) => {
      const parts = path.split('.');
      const lastPart = parts[parts.length - 1];
      const isIndex = /^\d+$/.test(lastPart);
      const propPath = isIndex ? parts.slice(0, -1).join('.') : path;
      const propObj = getPath(layer, propPath);
      if (propObj === undefined) return 0;
      let val;
      if (propObj && propObj.a === 1 && Array.isArray(propObj.k)){
        val = this.evaluateProp(propObj, f);
      } else if (propObj && propObj.k !== undefined){
        val = propObj.k;
      } else {
        val = propObj;
      }
      if (isIndex && Array.isArray(val)) return val[parseInt(lastPart, 10)] ?? 0;
      return val;
    };

    let fillColor = '#4a90e2';
    if (layer.ty === 4){
      const fl = this.findFill(layer);
      if (fl && fl.c && fl.c.k){
        const c = fl.c.k;
        const t2 = v => Math.round((v ?? 0) * 255);
        fillColor = '#' + t2(c[0]).toString(16).padStart(2,'0')
                       + t2(c[1]).toString(16).padStart(2,'0')
                       + t2(c[2]).toString(16).padStart(2,'0');
      }
    }
    let textValue='', textSize=36, textColor='#ffffff';
    if (layer.ty === 5){
      const doc = layer.t?.d?.k?.[0]?.s;
      if (doc){
        textValue = doc.t || '';
        textSize = doc.s || 36;
        const fc = doc.fc || [1,1,1];
        const t2 = v => Math.round(v*255);
        textColor = '#' + t2(fc[0]).toString(16).padStart(2,'0')
                       + t2(fc[1]).toString(16).padStart(2,'0')
                       + t2(fc[2]).toString(16).padStart(2,'0');
      }
    }

    let shapeHTML = '';
    if (layer.ty === 4){
      const shape = this.findFirstShape(layer);
      if (shape && (shape.ty === 'rc' || shape.ty === 'el')){
        const [sw, sh] = this.getShapeSize(shape);
        const label = shape.ty === 'rc' ? 'Прямоугольник' : 'Эллипс';
        let radiusRow = '';
        if (shape.ty === 'rc'){
          const r = this.getRectRadius(shape);
          radiusRow = `<div class="prop-row"><label>Радиус</label><input type="number" data-prop="shape.r" value="${Math.round(r)}" min="0"></div>`;
        }
        shapeHTML = `
          <h4>Фигура (${label})</h4>
          <div class="prop-row"><label>Ширина</label><input type="number" data-prop="shape.w" value="${Math.round(sw)}" min="1"></div>
          <div class="prop-row"><label>Высота</label><input type="number" data-prop="shape.h" value="${Math.round(sh)}" min="1"></div>
          ${radiusRow}`;
      }
    }

    const isAnimated = (propPath) => getPath(layer, propPath)?.a === 1;
    const kfHere = (propPath) => {
      const prop = getPath(layer, propPath);
      if (!prop || prop.a !== 1) return false;
      return prop.k.some(kf => kf.t === f);
    };
    const kfChips = (propPath) => {
      const prop = getPath(layer, propPath);
      if (!prop || prop.a !== 1) return '';
      const active = this.activeEasing?.path === propPath;
      return `<div class="kf-chips">${
        prop.k.map(k => {
          const isActive = active && this.activeEasing.frame === k.t;
          return `<span class="kf-chip${isActive?' active':''}" data-seek="${k.t}" data-kf-path="${propPath}" data-kf-frame="${k.t}" title="Клик — перейти и открыть Easing">◆ ${k.t}</span>`;
        }).join('')
      }</div>`;
    };

    const btn = (propPath, inputPath, label) => `
      <div class="prop-row">
        <label>${label}</label>
        <input type="number" data-prop="${inputPath}" value="${Math.round(getK(inputPath) ?? 0)}">
        <button class="kf-btn ${isAnimated(propPath)?'on':''} ${kfHere(propPath)?'on':''}"
                data-kf="${propPath}" title="Keyframe">◆</button>
      </div>
      ${kfChips(propPath)}
    `;

    let easingHTML = '';
    if (this.activeEasing){
      const path = this.activeEasing.path;
      const prop = getPath(layer, path);
      if (prop && prop.a === 1){
        const kfIdx = prop.k.findIndex(k => k.t === this.activeEasing.frame);
        if (kfIdx >= 0){
          const kf = prop.k[kfIdx];
          const isLast = kfIdx === prop.k.length - 1;
          if (isLast){
            easingHTML = `
              <div class="easing-editor">
                <h4>
                  <span class="easing-title">Easing: ${path} @ ${kf.t}</span>
                  <button class="easing-close" data-action="close-easing">×</button>
                </h4>
                <div class="easing-readout" style="color:#f88;">
                  Последний keyframe — нет исходящего сегмента.
                </div>
              </div>`;
          } else {
            const { p1, p2 } = readEasing(kf);
            easingHTML = this.buildEasingEditor(path, kf, p1, p2);
          }
        }
      }
    }

    this.propsContainer.innerHTML = `
      <h3>Слой ${i}</h3>
      <label>Имя <input type="text" data-prop="nm" value="${escapeHtml(layer.nm||'')}"></label>
      <div class="prop-row"><label>In</label><input type="number" data-prop="ip" value="${layer.ip||0}"></div>
      <div class="prop-row"><label>Out</label><input type="number" data-prop="op" value="${layer.op||0}"></div>
      <div class="prop-row"><label>St</label><input type="number" data-prop="st" value="${layer.st||0}"></div>
      <div class="prop-row" style="gap:6px;">
        <button class="danger-btn secondary" style="margin:0" data-action="move-up" ${i===0?'disabled':''}>↑ Выше</button>
        <button class="danger-btn secondary" style="margin:0" data-action="move-down" ${i===this.lottieData.layers.length-1?'disabled':''}>↓ Ниже</button>
      </div>
      <h4>Transform</h4>
      ${btn('ks.p', 'ks.p.0', 'Pos X')}
      ${btn('ks.p', 'ks.p.1', 'Pos Y')}
      ${btn('ks.s', 'ks.s.0', 'Scale')}
      ${btn('ks.r', 'ks.r',   'Rotate')}
      ${btn('ks.o', 'ks.o',   'Opacity')}
      ${shapeHTML}
      ${easingHTML}
      ${layer.ty === 4 ? `
        <h4>Заливка</h4>
        <label>Цвет <input type="color" data-prop="fill" value="${fillColor}"></label>` : ''}
      ${layer.ty === 5 ? `
        <h4>Текст</h4>
        <label>Содержимое <input type="text" data-prop="text.t" value="${escapeHtml(textValue)}"></label>
        <div class="prop-row"><label>Размер</label><input type="number" data-prop="text.s" value="${textSize}"></div>
        <label>Цвет <input type="color" data-prop="text.fc" value="${textColor}"></label>` : ''}
      <button class="danger-btn secondary" data-action="duplicate-layer">Дублировать</button>
      <button class="danger-btn" data-action="delete-layer">Удалить слой</button>
    `;
  }

  buildEasingEditor(path, kf, p1, p2){
    const pad = 20, size = 200, inner = size - pad * 2;
    const toSvg = (x, y) => [pad + x * inner, pad + (1 - y) * inner];
    const [x0, y0] = toSvg(0, 0);
    const [x3, y3] = toSvg(1, 1);
    const [c1x, c1y] = toSvg(p1[0], p1[1]);
    const [c2x, c2y] = toSvg(p2[0], p2[1]);
    let gridSVG = '';
    for (let i = 0; i <= 4; i++){
      const t = i / 4;
      const [gx] = toSvg(t, 0);
      const [, gy] = toSvg(0, t);
      gridSVG += `<line class="bezier-grid-line" x1="${gx}" y1="${pad}" x2="${gx}" y2="${size - pad}"/>`;
      gridSVG += `<line class="bezier-grid-line" x1="${pad}" y1="${gy}" x2="${size - pad}" y2="${gy}"/>`;
    }
    const presetButtons = Object.keys(EASING_PRESETS).map(name =>
      `<button data-preset="${name}">${name}</button>`).join('');
    const physButtons = Object.keys(PHYSICS_EASINGS).map(name =>
      `<button data-phys-preset="${name}">${name}</button>`).join('');
    return `
      <div class="easing-editor">
        <h4>
          <span class="easing-title">Easing: ${path} @ ${kf.t}</span>
          <button class="easing-close" data-action="close-easing" title="Закрыть">×</button>
        </h4>
        <div class="easing-svg-wrap">
          <svg class="easing-svg" viewBox="0 0 ${size} ${size}" data-easing-path="${path}" data-easing-frame="${kf.t}">
            ${gridSVG}
            <line class="bezier-axis" x1="${pad}" y1="${size-pad}" x2="${size-pad}" y2="${size-pad}"/>
            <line class="bezier-axis" x1="${pad}" y1="${pad}" x2="${pad}" y2="${size-pad}"/>
            <line class="bezier-diagonal" x1="${x0}" y1="${y0}" x2="${x3}" y2="${y3}"/>
            <line class="bezier-handle-line" x1="${x0}" y1="${y0}" x2="${c1x}" y2="${c1y}"/>
            <line class="bezier-handle-line" x1="${x3}" y1="${y3}" x2="${c2x}" y2="${c2y}"/>
            <path class="bezier-curve" d="M ${x0} ${y0} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x3} ${y3}"/>
            <circle class="bezier-endpoint" cx="${x0}" cy="${y0}" r="3"/>
            <circle class="bezier-endpoint" cx="${x3}" cy="${y3}" r="3"/>
            <circle class="bezier-handle" data-handle="1" cx="${c1x}" cy="${c1y}" r="6"/>
            <circle class="bezier-handle" data-handle="2" cx="${c2x}" cy="${c2y}" r="6"/>
          </svg>
        </div>
        <div class="easing-section-label">Bezier</div>
        <div class="easing-presets">${presetButtons}</div>
        <div class="easing-section-label">Физика (генерация keyframes)</div>
        <div class="easing-presets phys">${physButtons}</div>
        <div class="easing-readout">
          P1: (${p1[0].toFixed(2)}, ${p1[1].toFixed(2)}) &nbsp; P2: (${p2[0].toFixed(2)}, ${p2[1].toFixed(2)})
        </div>
      </div>
    `;
  }

  startEasingDrag(handle, e){
    e.preventDefault();
    const svg = handle.closest('.easing-svg');
    if (!svg) return;
    const path = svg.dataset.easingPath;
    const frame = parseInt(svg.dataset.easingFrame, 10);
    const handleNum = parseInt(handle.dataset.handle, 10);
    try { svg.setPointerCapture(e.pointerId); } catch(_){}
    const pad = 20, size = 200, inner = size - pad * 2;
    this.beginTransaction('Easing');
    const onMove = ev => {
      const rect = svg.getBoundingClientRect();
      const svgX = (ev.clientX - rect.left) / rect.width * size;
      const svgY = (ev.clientY - rect.top) / rect.height * size;
      let nx = clamp((svgX - pad) / inner, 0, 1);
      let ny = clamp(1 - (svgY - pad) / inner, -1, 2);
      const layer = this.lottieData.layers[this.selectedLayerIndex];
      if (!layer) return;
      const prop = getPath(layer, path);
      if (!prop || prop.a !== 1) return;
      const kf = prop.k.find(k => k.t === frame);
      if (!kf) return;
      const cur = readEasing(kf);
      if (handleNum === 1) cur.p1 = [nx, ny];
      else cur.p2 = [nx, ny];
      writeEasing(kf, cur.p1, cur.p2);
      const toSvg = (x, y) => [pad + x * inner, pad + (1 - y) * inner];
      const [c1x, c1y] = toSvg(cur.p1[0], cur.p1[1]);
      const [c2x, c2y] = toSvg(cur.p2[0], cur.p2[1]);
      const [x0, y0] = toSvg(0, 0);
      const [x3, y3] = toSvg(1, 1);
      const handles = svg.querySelectorAll('.bezier-handle');
      handles[0].setAttribute('cx', c1x); handles[0].setAttribute('cy', c1y);
      handles[1].setAttribute('cx', c2x); handles[1].setAttribute('cy', c2y);
      const lines = svg.querySelectorAll('.bezier-handle-line');
      lines[0].setAttribute('x2', c1x); lines[0].setAttribute('y2', c1y);
      lines[1].setAttribute('x2', c2x); lines[1].setAttribute('y2', c2y);
      svg.querySelector('.bezier-curve').setAttribute('d', `M ${x0} ${y0} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x3} ${y3}`);
      const readout = svg.closest('.easing-editor').querySelector('.easing-readout');
      if (readout) readout.textContent = `P1: (${cur.p1[0].toFixed(2)}, ${cur.p1[1].toFixed(2)})  P2: (${cur.p2[0].toFixed(2)}, ${cur.p2[1].toFixed(2)})`;
    };
    const onUp = ev => {
      svg.removeEventListener('pointermove', onMove);
      svg.removeEventListener('pointerup', onUp);
      try { svg.releasePointerCapture(ev.pointerId); } catch(_){}
      this.updatePreview(); this.renderTimeline(); this.refreshJsonIfVisible();
      this.endTransaction();
    };
    svg.addEventListener('pointermove', onMove);
    svg.addEventListener('pointerup', onUp);
  }

  // ========== Evaluate ==========
  evaluateProp(prop, frame){
    if (prop.a !== 1 || !Array.isArray(prop.k) || !prop.k.length) return prop.k;
    const kfs = prop.k;
    if (frame <= kfs[0].t) return kfs[0].s;
    if (frame >= kfs[kfs.length-1].t) return kfs[kfs.length-1].s;
    for (let i=0;i<kfs.length-1;i++){
      const a = kfs[i], b = kfs[i+1];
      if (frame >= a.t && frame <= b.t){
        if (b.t === a.t) return a.s;
        const t = (frame - a.t) / (b.t - a.t);
        const sa = Array.isArray(a.s) ? a.s : [a.s];
        const sb = Array.isArray(b.s) ? b.s : [b.s];
        const out = sa.map((v,k) => (v ?? 0) + ((sb[k] ?? 0) - (v ?? 0)) * t);
        return Array.isArray(a.s) ? out : out[0];
      }
    }
    return kfs[kfs.length-1].s;
  }

  findFill(layer){
    if (!layer.shapes) return null;
    for (const g of layer.shapes){
      if (g.it){
        for (const it of g.it){ if (it.ty === 'fl') return it; }
      }
    }
    return null;
  }

  onPropInput(e){
    const el = e.target;
    if (!el.dataset.prop) return;
    const i = this.selectedLayerIndex;
    if (i < 0) return;
    const layer = this.lottieData.layers[i];
    if (layer.locked) return;
    const prop = el.dataset.prop;
    const st = this.getLayerSt(layer);
    const internalF = Math.round(this.currentFrame) - st;

    if (prop === 'nm'){
      layer.nm = el.value;
      this.renderLayers(); this.renderTimeline(); this.refreshJsonIfVisible();
      this.scheduleCommit('Rename layer');
      return;
    }
    if (prop === 'ip' || prop === 'op' || prop === 'st'){
      const v = parseInt(el.value,10);
      if (isNaN(v)) return;
      if (prop === 'ip' && v >= (layer.op||0)) layer.op = v + 1;
      if (prop === 'op' && v <= (layer.ip||0)) layer.ip = v - 1;
      layer[prop] = v;
      this.updatePreview(); this.renderTimeline(); this.refreshJsonIfVisible();
      this.scheduleCommit('Change timing');
      return;
    }
    if (prop.startsWith('shape.')){
      const shape = this.findFirstShape(layer);
      if (!shape) return;
      const v = parseFloat(el.value);
      if (isNaN(v)) return;
      if (prop === 'shape.w' || prop === 'shape.h'){
        const [w, h] = this.getShapeSize(shape);
        if (prop === 'shape.w') this.setShapeSize(shape, Math.max(1, v), h);
        else this.setShapeSize(shape, w, Math.max(1, v));
      } else if (prop === 'shape.r' && shape.ty === 'rc'){
        this.setRectRadius(shape, Math.max(0, v));
      }
      this.updatePreview(); this.refreshJsonIfVisible();
      this.scheduleCommit('Change shape');
      return;
    }
    if (prop.startsWith('ks.')){
      const parts = prop.split('.');
      const propName = parts[1];
      const idx = parts[2] !== undefined ? parseInt(parts[2],10) : null;
      const val = parseFloat(el.value);
      if (isNaN(val)) return;
      const p = layer.ks[propName];
      if (!p) return;

      if (p.a === 1){
        const f = internalF;
        let kf = p.k.find(k => k.t === f);
        if (!kf){
          const sample = this.evaluateProp(p, f);
          kf = { t: f, s: Array.isArray(sample) ? [...sample] : sample };
          p.k.push(kf);
          p.k.sort((a,b)=>a.t-b.t);
          p.k.forEach((k, ii) => {
            if (ii < p.k.length-1 && !k.i){ k.i = {x:[0.5],y:[0.5]}; k.o = {x:[0.5],y:[0.5]}; }
          });
        }
        if (idx !== null && Array.isArray(kf.s)) kf.s[idx] = val;
        else kf.s = val;
      } else {
        if (idx !== null && Array.isArray(p.k)) p.k[idx] = val;
        else p.k = val;
      }
      this.updatePreview(); this.renderTimeline(); this.refreshJsonIfVisible();
      this.scheduleCommit('Change transform');
      return;
    }
    if (prop === 'fill'){
      const fl = this.findFill(layer);
      if (fl && fl.c){
        const hex = el.value;
        fl.c = { a:0, k: [
          parseInt(hex.slice(1,3),16)/255,
          parseInt(hex.slice(3,5),16)/255,
          parseInt(hex.slice(5,7),16)/255, 1
        ]};
        this.updatePreview(); this.refreshJsonIfVisible();
      }
      this.scheduleCommit('Change fill');
      return;
    }
    if (prop.startsWith('text.')){
      const sub = prop.slice(5);
      const doc = layer.t?.d?.k?.[0]?.s;
      if (!doc) return;
      if (sub === 't') doc.t = el.value;
      else if (sub === 's') doc.s = parseFloat(el.value) || 36;
      else if (sub === 'fc'){
        const hex = el.value;
        doc.fc = [
          parseInt(hex.slice(1,3),16)/255,
          parseInt(hex.slice(3,5),16)/255,
          parseInt(hex.slice(5,7),16)/255
        ];
      }
      this.updatePreview(); this.refreshJsonIfVisible();
      this.scheduleCommit('Change text');
      return;
    }
  }

  onPropClick(e){
    const physBtn = e.target.closest('[data-phys-preset]');
    if (physBtn && this.activeEasing){ this.applyPhysics(physBtn.dataset.physPreset); return; }
    const presetBtn = e.target.closest('[data-preset]');
    if (presetBtn && this.activeEasing){
      const vals = EASING_PRESETS[presetBtn.dataset.preset];
      if (vals) this.applyEasingToActive([vals[0], vals[1]], [vals[2], vals[3]]);
      return;
    }
    const chip = e.target.closest('.kf-chip');
    if (chip){
      const internalFrame = parseFloat(chip.dataset.seek);
      const path = chip.dataset.kfPath;
      const layer = this.lottieData.layers[this.selectedLayerIndex];
      const st = layer ? this.getLayerSt(layer) : 0;
      const absFrame = st + internalFrame;
      this.currentFrame = absFrame;
      if (this.animInstance) try { this.animInstance.goToAndStop(absFrame, true); } catch(_){}
      this.activeEasing = { path, frame: internalFrame };
      this.updatePlayhead(); this.updateFrameDisplay();
      this.renderTimeline(); this.renderProps();
      return;
    }
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.action === 'close-easing'){
      this.activeEasing = null;
      this.renderProps(); this.renderTimeline();
      return;
    }
    if (btn.dataset.action === 'unlock-layer'){
      const i = this.selectedLayerIndex;
      if (i < 0) return;
      this.beginTransaction('Unlock layer');
      delete this.lottieData.layers[i].locked;
      this.endTransaction();
      this.renderLayers(); this.renderTimeline(); this.renderProps();
      return;
    }
    if (btn.dataset.kf){ this.toggleKeyframe(btn.dataset.kf); return; }
    const a = btn.dataset.action;
    if (a === 'delete-layer'){ this.deleteSelectedLayer(); return; }
    if (a === 'duplicate-layer'){ this.duplicateSelectedLayer(); return; }
    if (a === 'move-up'){
      const i = this.selectedLayerIndex;
      if (i <= 0) return;
      this.beginTransaction('Move layer up');
      const [l] = this.lottieData.layers.splice(i, 1);
      this.lottieData.layers.splice(i-1, 0, l);
      this.selectedLayerIndex = i-1;
      this.endTransaction();
      this.renderLayers(); this.renderTimeline(); this.renderProps(); this.refreshJsonIfVisible();
      return;
    }
    if (a === 'move-down'){
      const i = this.selectedLayerIndex;
      const n = this.lottieData.layers.length;
      if (i < 0 || i >= n-1) return;
      this.beginTransaction('Move layer down');
      const [l] = this.lottieData.layers.splice(i, 1);
      this.lottieData.layers.splice(i+1, 0, l);
      this.selectedLayerIndex = i+1;
      this.endTransaction();
      this.renderLayers(); this.renderTimeline(); this.renderProps(); this.refreshJsonIfVisible();
      return;
    }
  }

  applyEasingToActive(p1, p2){
    if (!this.activeEasing) return;
    const layer = this.lottieData.layers[this.selectedLayerIndex];
    if (!layer || layer.locked) return;
    const prop = getPath(layer, this.activeEasing.path);
    if (!prop || prop.a !== 1) return;
    const kf = prop.k.find(k => k.t === this.activeEasing.frame);
    if (!kf) return;
    this.beginTransaction('Apply easing');
    writeEasing(kf, p1, p2);
    this.endTransaction();
    this.updatePreview(); this.renderTimeline(); this.renderProps(); this.refreshJsonIfVisible();
  }

  applyPhysics(key){
    const fn = PHYSICS_EASINGS[key];
    if (!fn || !this.activeEasing) return;
    const layer = this.lottieData.layers[this.selectedLayerIndex];
    if (!layer || layer.locked) return;
    const prop = getPath(layer, this.activeEasing.path);
    if (!prop || prop.a !== 1) return;
    const idx = prop.k.findIndex(k => k.t === this.activeEasing.frame);
    if (idx < 0 || idx >= prop.k.length - 1) return;
    this.beginTransaction('Physics easing');
    const a = prop.k[idx], b = prop.k[idx + 1];
    const len = b.t - a.t;
    const steps = clamp(Math.round(len / 2), 6, 25);
    const newKFs = this.generatePhysicsKF(a.t, b.t, a.s, b.s, fn, steps);
    prop.k.splice(idx, 2, ...newKFs);
    this.endTransaction();
    this.activeEasing = null;
    this.updatePreview(); this.renderTimeline(); this.renderProps(); this.refreshJsonIfVisible();
  }

  generatePhysicsKF(startF, endF, startVal, endVal, easeFn, steps){
    const isArr = Array.isArray(startVal);
    const kfs = [];
    for (let i = 0; i <= steps; i++){
      const t = i / steps;
      const eased = easeFn(t);
      let s;
      if (isArr) s = startVal.map((v, k) => v + ((endVal[k] ?? v) - v) * eased);
      else s = startVal + (endVal - startVal) * eased;
      const fr = Math.round(startF + (endF - startF) * t);
      kfs.push({ t: fr, s });
    }
    const seen = new Set();
    const uniq = [];
    for (const kf of kfs){ if (!seen.has(kf.t)){ seen.add(kf.t); uniq.push(kf); } }
    for (let i = 0; i < uniq.length - 1; i++){
      uniq[i].i = {x:[0.5], y:[0.5]};
      uniq[i].o = {x:[0.5], y:[0.5]};
    }
    return uniq;
  }

  toggleKeyframe(path){
    const i = this.selectedLayerIndex;
    if (i < 0) return;
    const layer = this.lottieData.layers[i];
    if (layer.locked) return;
    const p = getPath(layer, path);
    if (!p) return;
    const st = this.getLayerSt(layer);
    const f = Math.round(this.currentFrame) - st;

    this.beginTransaction('Toggle keyframe');
    if (p.a !== 1){
      const oldVal = p.k;
      p.a = 1;
      p.k = [
        { t: 0, s: Array.isArray(oldVal) ? [...oldVal] : oldVal, i:{x:[0.5],y:[0.5]}, o:{x:[0.5],y:[0.5]} },
        { t: f === 0 ? 30 : f, s: Array.isArray(oldVal) ? [...oldVal] : oldVal }
      ];
      if (f === 0) p.k = [ { t: 0, s: Array.isArray(oldVal) ? [...oldVal] : oldVal } ];
    } else {
      const existing = p.k.find(k => k.t === f);
      if (existing){
        if (p.k.length > 1){
          p.k = p.k.filter(k => k.t !== f);
          if (this.activeEasing?.path === path && this.activeEasing.frame === f){
            this.activeEasing = null;
          }
        } else {
          p.a = 0;
          p.k = existing.s;
          this.activeEasing = null;
        }
      } else {
        const sample = this.evaluateProp(p, f);
        p.k.push({ t: f, s: Array.isArray(sample) ? [...sample] : sample });
        p.k.sort((a,b)=>a.t-b.t);
        p.k.forEach((k, ii) => {
          if (ii < p.k.length-1 && !k.i){ k.i = {x:[0.5],y:[0.5]}; k.o = {x:[0.5],y:[0.5]}; }
        });
      }
    }
    this.endTransaction();
    this.updatePreview(); this.renderTimeline(); this.renderProps(); this.refreshJsonIfVisible();
  }

  addShapeLayer(type){
    const op = this.lottieData.op || 90;
    const ind = nextLayerInd(this.lottieData);
    const name = (type === 'el' ? 'Ellipse ' : 'Rect ') + ind;
    const layer = makeShapeLayer(name, type, 100, 100, [0.4,0.6,1,1], 0, op, ind);
    this.beginTransaction('Add shape layer');
    this.lottieData.layers.unshift(layer);
    this.selectedLayerIndex = 0;
    this.activeEasing = null;
    this.endTransaction();
    this.updatePreview(); this.renderLayers(); this.renderTimeline();
    this.renderProps(); this.refreshJsonIfVisible();
  }
  addTextLayer(){
    const op = this.lottieData.op || 90;
    const ind = nextLayerInd(this.lottieData);
    const layer = makeTextLayer('Text ' + ind, 'Hello', 48, [1,1,1], 0, op, ind);
    if (!this.lottieData.fonts){
      this.lottieData.fonts = { list:[{ fName:"Arial", fFamily:"Arial", fStyle:"Regular", ascent:71.6 }] };
    }
    this.beginTransaction('Add text layer');
    this.lottieData.layers.unshift(layer);
    this.selectedLayerIndex = 0;
    this.activeEasing = null;
    this.endTransaction();
    this.updatePreview(); this.renderLayers(); this.renderTimeline();
    this.renderProps(); this.refreshJsonIfVisible();
  }

  toggleView(){
    this.viewMode = this.viewMode === 'visual' ? 'code' : 'visual';
    const b = this.toolbar.querySelector('[data-action="toggle-view"]');
    if (this.viewMode === 'code'){
      b.textContent = '🎬 Visual View';
      this.jsonPanel.style.display = 'flex';
      this.jsonTextarea.value = JSON.stringify(this.lottieData, null, 2);
      this.jsonError.classList.remove('visible');
    } else {
      b.textContent = '📝 Code View';
      this.jsonPanel.style.display = 'none';
    }
  }
  refreshJsonIfVisible(){
    if (this.viewMode === 'code' && document.activeElement !== this.jsonTextarea){
      this.jsonTextarea.value = JSON.stringify(this.lottieData, null, 2);
    }
  }
  applyJsonFromEditor(){
    try {
      const parsed = JSON.parse(this.jsonTextarea.value);
      if (!parsed.layers || !Array.isArray(parsed.layers)) throw new Error('Нет массива layers');
      this.beginTransaction('Edit JSON');
      this.lottieData = parsed;
      this.jsonError.classList.remove('visible');
      this.currentFrame = Math.min(this.currentFrame, parsed.op || 0);
      this.totEl.textContent = parsed.op;
      this.selectedLayerIndex = -1;
      this.activeEasing = null;
      this.endTransaction();
      this.updatePreview(); this.renderLayers(); this.renderTimeline(); this.renderProps();
    } catch(err){
      this.jsonError.textContent = '⚠ ' + err.message;
      this.jsonError.classList.add('visible');
    }
  }

  handleImport(e){
    const file = e.target.files?.[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const p = JSON.parse(ev.target.result);
        this.beginTransaction('Import');
        this.lottieData = p;
        this.currentFrame = 0;
        this.selectedLayerIndex = -1;
        this.activeEasing = null;
        this.totEl.textContent = p.op;
        this.endTransaction();
        this.updatePreview(); this.renderLayers(); this.renderTimeline();
        this.renderProps(); this.refreshJsonIfVisible();
      } catch(err){ alert('Ошибка: ' + err.message); }
    };
    r.readAsText(file);
    e.target.value = '';
  }
  exportJson(){
    const blob = new Blob([JSON.stringify(this.lottieData, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'animation.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }
}

customElements.define('lottie-editor', LottieEditor);
</script>
</body>
</html>
